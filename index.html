<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Cipher Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            color: #007bff;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .output-box {
            background: #e9ecef;
            padding: 15px;
            border-radius: 4px;
            word-break: break-all;
            font-family: monospace;
            font-size: 18px;
            min-height: 24px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Number Cipher</h2>
        
        <div class="form-group">
            <label for="caseSelect">Choose Letter Case:</label>
            <select id="caseSelect" onchange="convertText()">
                <option value="lower">Lowercase</option>
                <option value="upper">Uppercase</option>
            </select>
        </div>

        <div class="form-group">
            <label for="inputText">Type Text:</label>
            <input type="text" id="inputText" placeholder="Type something..." oninput="convertText()">
        </div>

        <div class="form-group">
            <label>Output:</label>
            <div id="outputText" class="output-box"></div>
        </div>
    </div>

    <script>
        // Mapping definitions based on your rules
        const lowerMap = {
            'o': '0',
            'l': '1',
            'z': '2',
            'e': '3',
            'a': '4',
            's': '5',
            'g': '6', // Using 'g' for 6 based on b/G context
            'b': '6',
            't': '7',
            'b': '8', // Note: 'b' maps to both 6 and 8 in your prompt list, let's use 8 for uppercase/lowercase split or follow strict mapping. Let's map explicitly:
        };

        // Let's refine the maps precisely based on your prompt:
        // 0: O/o, 1: I/l, 2: Z/z, 3: E, 4: A, 5: S/s, 6: b/G, 7: t/T, 8: B, 9: q
        
        const mappings = {
            lower: {
                'o': '0',
                'l': '1',
                'z': '2',
                's': '5',
                'b': '6',
                't': '7',
                'q': '9'
            },
            upper: {
                'O': '0',
                'I': '1',
                'Z': '2',
                'E': '3',
                'A': '4',
                'S': '5',
                'G': '6',
                'T': '7',
                'B': '8'
            }
        };

        function convertText() {
            const caseChoice = document.getElementById('caseSelect').value;
            let text = document.getElementById('inputText').value;
            
            // Apply case modification first if desired, or respect user input based on selection
            if (caseChoice === 'upper') {
                text = text.toUpperCase();
            } else {
                text = text.toLowerCase();
            }

            const activeMap = mappings[caseChoice];
            let result = '';

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                // If the character exists in our map, replace it; otherwise, keep the original character
                if (activeMap[char] !== undefined) {
                    result += activeMap[char];
                } else {
                    result += char;
                }
            }

            document.getElementById('outputText').innerText = result;
        }
    </script>

</body>
</html>
